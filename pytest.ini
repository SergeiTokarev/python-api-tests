[pytest]
pythonpath = .
testpaths = tests reference
python_files = test_*.py
python_functions = test_*

# -v        подробный вывод: видно имя каждого теста
# -ra       краткая сводка по упавшим в конце прогона
# --strict-markers   опечатка в имени маркера станет ошибкой, а не тихо пройдёт
addopts = -v -ra --strict-markers

markers =
    smoke: быстрые проверки, что API вообще жив
    positive: проверки ожидаемого поведения
    negative: проверки реакции на некорректный ввод
